# Claims from the team's experience log (skill_registry/agent_skills/manipulation_recovery.experience.md) about the
# stance before a press: where the walk leaves the robot, and what that does to the view and the reach.
# Load them into the store with:   ros2 run orchestrator knowledge seed <this file>
# Each goes in as an observation by 'person:experience_log', with its E-entries as evidence and no run, so it
# counts as one source: it becomes a belief only when runs confirm it (docs/knowledge.md, "Graduation").
# A claim whose text is already in the store is skipped, so loading twice changes nothing.
# Keep the wording in step with the experience entries it cites.

- text: >-
    Walks to the call panel ended between 1 cm short of the place and 17 cm past it, and 5 to 10 cm to its right, in
    the agent trial of 2026-11-04; each arrival 8 cm or more past the place put the requested button out of the camera's view.
  about: {place: freight_elevator_call_panel, skill: navigate_to}
  evidence: [E-001, E-015]

- text: >-
    The walk from the call panel into the cabin ended 24 cm past the inside place and the requested button fell out
    of the camera's view; a 0.35 m walk from behind the place ended 3 cm past it and 5 cm to its left, and the presses
    from there reached floor 1.
  about: {place: inside_freight_elevator_button_panel, skill: navigate_to}
  evidence: [E-001, E-015, E-016]

- text: >-
    From 13 cm behind the inside place, about 0.55 m from floor 1, press_button reported success but the fingertip
    stopped 67 mm short and 39 mm beside the goal: out of reach, and the action did not say so.
  about: {place: inside_freight_elevator_button_panel, skill: press_button}
  evidence: [E-018]

- text: >-
    In frames from stances that pressed well, the down button sat near y 540 of 720 at the call panel; when the robot
    stopped too close it was cut by the bottom edge or below it, and the seed found no box.
  about: {place: freight_elevator_call_panel, skill: track}
  evidence: [E-015]

- text: >-
    In frames from stances that pressed well, floor 1 sat near y 450 to 600 of 720 inside the cabin; when the robot
    stopped too close only the panel sign and bare steel were in view, and the seed found no box.
  about: {place: inside_freight_elevator_button_panel, skill: track}
  evidence: [E-015]

- text: >-
    Inside the cabin the left arm failed IK for floor buttons at y +0.05 to +0.07 m and z 0.22 to 0.24 m above the
    pelvis, and the right arm reached them.
  about: {place: inside_freight_elevator_button_panel, skill: press_button}
  evidence: [E-007]

- text: >-
    A reposition goal under 0.10 m from where the robot stands, counting the sideways part, takes no step; the press
    subtree then walks to a pose 0.15 m behind it first, and onto it.
  about: {skill: navigate_to}
  evidence: [E-016, E-002]
