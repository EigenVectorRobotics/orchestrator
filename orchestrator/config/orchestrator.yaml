# Parameters for all orchestrator nodes, loaded by orchestrator.launch.py (params_file:=... to use another).
# /** applies to every node; a node that does not declare a parameter ignores it.
# contracts_directory, places_file and vlm_base_url are launch arguments, so they are not set here.
/**:
  ros__parameters:
    essential_devices: [nuc, orin]      # devices whose loss stops the robot anyway; skills elsewhere need a recovery

orchestrator_executor:
  ros__parameters:
    tick_hz: 10.0
    image_topic: /camera/camera/color/image_raw    # raw: the Orin has no compressed transport
    vlm_model: local

orchestrator_planner:
  ros__parameters:
    effort: high
    max_attempts: 3
    use_live_skills: true
    auto_run: true

skill_registry:
  ros__parameters:
    max_age_s: 5.0
