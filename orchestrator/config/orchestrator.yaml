# Parameters for all orchestrator nodes, loaded by orchestrator.launch.py (params_file:=... to use another).
# /** applies to every node; a node that does not declare a parameter ignores it.
# contracts_directory, places_file and vlm_base_url are launch arguments, so they are not set here.
/**:
  ros__parameters:
    essential_devices: [nuc, orin]      # devices whose loss stops the robot anyway; skills elsewhere need a recovery

orchestrator_executor:
  ros__parameters:
    tick_hz: 10.0
    image_topic: /camera/camera/color/image_raw    # raw: the Orin has no compressed transport
    camera_info_topic: /camera/camera/color/camera_info    # its intrinsics and optical frame (Camera.k, Camera.frame_id)
    vlm_model: local
    vlm_timeout_s: 40.0                 # Cosmos on the Thor serves one request at a time
    # agent_backend is the launch argument agent_backend (default push): a node-named entry here would override it
    # require_recorder is set by the launch argument record (default true): no tree runs unrecorded

orchestrator_recorder:
  ros__parameters:
    # root: ~/orch_runs (default), one folder per bring-up; the operator clears old runs by hand
    min_free_gb: 20.0                   # below this, no tree runs (checked at start and every 5 s)
    bag: true                           # a bag of bag_topics for each tree run
    # bag_topics: run_recorder.py BAG_TOPICS (default); set it here only to record other topics

orchestrator_planner:
  ros__parameters:
    effort: high
    max_attempts: 3
    use_live_skills: true
    auto_run: true
