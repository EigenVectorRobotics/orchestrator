[develop]
script_dir=$base/lib/orchestrator
[install]
install_scripts=$base/lib/orchestrator

# The default run is the rules branch agentic depends on. Two paths live on main and ltx-dev and no skill here can
# reach them, so they are marked and deselected: run them with -m manipulation or -m tree_mode.
[tool:pytest]
addopts = -m "not manipulation and not tree_mode"
markers =
    manipulation: the press and arm-recovery path; agentic has no contract that reaches it
    tree_mode: the LLM tree planner, which task mode replaced
