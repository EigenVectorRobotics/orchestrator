name: inside_cabin
kind: condition
device: nuc
description: The robot is in the cabin of the elevator that set_elevator named, from its map x and y (the area <elevator>_cabin of the places file).
interface:
  transport: watch
  success_when:
    topic: /slam_elevatorlio/elevator_side
    ros_type: std_msgs/msg/String
    field: data
    equals: in
    latched: true
maturity: untested
source: navigation_stack slam_elevatorlio (parameter places_file, topic /elevator_name), area <elevator>_cabin of the places file
notes: Also picks door_state_node's square (cabin when out, hall when in) and the storey route_planner plans on in the cabin (the goal's).
