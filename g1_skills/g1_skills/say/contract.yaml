name: say
kind: action
device: nuc
description: Speak a sentence
interface:
  transport: topic
  name: /speak                  # unitree_interface subscribes ~/tts; its launch remaps /unitree_interface/tts to /speak
  ros_type: std_msgs/msg/String
inputs:
- name: text
  type: string
  field: data
resources:
- voice
timeout_s: 10
maturity: wip
source: unitree_interface/unitree_interface/src/unitree_interface.cpp
