name: ground
kind: action
device: thor
description: Find 2D boxes for an elevator target in the latest camera frame
interface:
  transport: service
  name: /vlm_ground_server/ground_boxes
  ros_type: vlm_interfaces/srv/GroundBoxes
inputs:
  - {name: query, type: enum, choices: [floor_1, floor_2, floor_3, up, down, floor_buttons, call_buttons]}
  - {name: max_detections, type: int, required: false, default: 0}
outputs:
  - {name: detections, type: string, description: blackboard key for the Detection2DArray}
resources: []
timeout_s: 5
maturity: untested
source: vlm/vlm_ros/vlm/ground_server.py (node vlm_ground_server)
notes: Check that it is live.
