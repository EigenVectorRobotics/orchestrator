name: launch_nuc_stack
kind: action
device: nuc
description: Start the NUC stack in tmux (-L eigen_vector), as docs/run.md, section 6. Does nothing when it runs.
interface:
  transport: command
  command: |
    tmux -L eigen_vector has-session -t eigen_vector 2>/dev/null && exit 0
    tmux -L eigen_vector new-session -d -s eigen_vector "bash -lc 'source ~/eigen_vector_ws/env.sh && LD_PRELOAD=\"\$EIGEN_VECTOR_PRELOAD\" ros2 launch bringup nuc.launch.py map:=/home/vector/maps/two_floor_clean_cabin2.pcd localization:=true 2>&1 | tee ~/eigen_vector_ws/launch.log'"
timeout_s: 30
maturity: untested
source: orchestrator/orchestrator/health/checks.py (run_command)
notes: Returns once tmux has started; poll nuc_up for the stack to come up (about 15 to 20 s).
