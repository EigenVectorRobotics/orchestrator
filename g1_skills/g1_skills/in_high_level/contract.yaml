name: in_high_level
kind: condition
device: nuc
description: The Unitree control mode is HighLevel, the mode the robot walks and presses in
interface:
  transport: watch
  success_when:
    topic: /unitree_interface/current_mode
    ros_type: unitree_interface_msgs/msg/ControlMode
    field: current_mode_id
    equals: 2                   # CONTROL_MODE_HIGH_LEVEL
    latched: true               # unitree_interface publishes it TRANSIENT_LOCAL, on change
maturity: wip
source: unitree_interface/unitree_interface_msgs/msg/ControlMode.msg
notes: >-
  Check it before set_mode high_level: a transition to the mode the robot is already in fails ("Mode transition
  failed"), so <Fallback><in_high_level/><set_mode mode="high_level"/></Fallback>.
