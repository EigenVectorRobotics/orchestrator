name: navigate_to
kind: action
device: nuc
description: Walk to a pose in the map frame on the prior-map route graph
interface:
  transport: action
  name: /route_planner/navigate_to_goal
  ros_type: navigation_interfaces/action/NavigateToGoal
  failure_when:                 # a route that stays blocked: cancel and fail before timeout_s
    field: state
    equals: blocked
    hold_s: 10
inputs:
- name: goal
  type: pose
  description: map-frame goal pose
  field: goal
pre:
- localized
resources:
- base
timeout_s: 300                  # a walk between the two elevators on one floor takes about 190 s
fallback:
- cancel_nav
maturity: wip
source: navigation_stack/route_planner/route_planner/route_planner_node.py
notes: >-
  Succeeds only on arrival: local_planner's /goal_reached with the robot within its goal_reached_threshold (navigation_stack local_planner/config/unitree_g1.yaml).
  The status state "arrived" comes earlier, when the goal is within lookahead along the route, so it is not the end.
  The result's reason says why a goal ended, e.g. arrived, cancelled, replaced by a new goal, autonomy off.
  The feedback state is routing | arrived | blocked, sent when it changes. blocked can clear when new terrain frees
  the route, so it fails the skill only after it has held for hold_s (10 s is a guess; the sim stalls out after 8 s).
