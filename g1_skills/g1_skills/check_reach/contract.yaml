name: check_reach
kind: condition
device: nuc
description: >-
  Whether the arm reaches the tracked button from where the robot stands, as move_to_pose would plan it, without moving
  the arm or changing the profile. Run it after a look (button_in_view seeds the track); it fails when no fresh target
  pose is there. The target is press_button's goal, moved by the press offset in force. Outputs the miss (arm end minus
  target, m) in the pelvis frame: pelvis_error_x forward, pelvis_error_y left, pelvis_error_z up; and the target
  there without the offset (target_pelvis_*)
interface:
  transport: python
  name: /check_reach
  ros_type: humanoid_manipulation_interfaces/srv/CheckReach
  requires:
    services: [/check_reach]
config:
  target:
    pose_topic: /track_3d/selected_normal_pose_filtered/arm_upright   # what press_button sends to move_to_pose, in foot_world
  limits:
    max_age_s: 2.0
inputs:
- {name: left_arm, type: bool, required: false, default: false}
outputs:
- {name: position_error, type: float, description: 'm, from the planned path to the target'}
- {name: orientation_error_deg, type: float}
- {name: pelvis_error_x, type: float, description: 'm, arm end minus target, in the pelvis frame: forward; negative: the arm stops short of it'}
- {name: pelvis_error_y, type: float, description: 'm, arm end minus target, pelvis frame: left'}
- {name: pelvis_error_z, type: float, description: 'm, arm end minus target, pelvis frame: up'}
- {name: target_pelvis_x, type: float, description: 'm, the target without the press offset, in pelvis at the check: forward'}
- {name: target_pelvis_y, type: float, description: 'm, left'}
- {name: target_pelvis_z, type: float, description: 'm, up'}
timeout_s: 10
record: true    # every answer goes in the history, a pass included: manipulation_recovery weighs it after a failed press
maturity: untested
source: manipulation_stack g1_pilot/src/ik_server.cpp (CheckReach.srv, branch feat/ik-server); move_to_pose.launch.py starts it
notes: >-
  Same planner, joint limits and goal tolerances as move_to_pose (5 mm, 0.1 rad), from the live joint state. ik_server
  keeps the arm_safety_distance it was launched with (0); the executor adds the press offset of the last set_press_offset
  to the target instead. The look runs it after prepare_arm and the EKF reset, so the press shares its mode, profile
  and foot_world; only the arm's start differs. Robot test 2026-11-13: 0.01 to 0.1 s per call; the same answer for a target given in pelvis,
  foot_world or map.
