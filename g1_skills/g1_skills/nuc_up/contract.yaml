name: nuc_up
kind: condition
device: nuc
description: The NUC stack runs - robot interface, localization, the four navigation nodes and door_state_node
interface:
  transport: alive
  alive:
    topics: [/feedback, /slam_elevatorlio/status, /unitree_interface/current_mode, /unitree_interface/fsm_id,
             /terrain_map, /path, /navigation_cmd_vel, /route_planner/status, /door_state]
    services: [/unitree_interface/change_mode]
timeout_s: 10
maturity: untested
source: orchestrator/orchestrator/preflight_checks.py (judge_alive)
notes: >-
  Before a task (preflight). /unitree_interface/fsm_id needs unitree_interface with the FSM id topic. The last four
  topics are one per navigation node (terrain_analysis, local_planner, path_follower, route_planner): a partial stack
  with the robot interface and SLAM only (as once in tmux -L elevtest) must fail this check.
