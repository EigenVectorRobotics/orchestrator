name: docs

on:
  push:
    branches-ignore: ['github-pages/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/tools/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/tools/requirements.txt
      - name: Lay out the Jekyll source
        run: python docs/tools/build_site.py _site_src
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --source _site_src --destination site --baseurl "/${GITHUB_REPOSITORY#*/}"
      - name: Push the site to github-pages/<branch>
        working-directory: site
        run: |
          touch .nojekyll
          git init -q -b pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "docs: site for ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/github-pages/${GITHUB_REF_NAME}"
