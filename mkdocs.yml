site_name: Orchestrator
site_description: Agentic behavior-tree execution for the Unitree G1 elevator task
site_url: https://eigenvectorrobotics.github.io/orchestrator/
repo_url: https://github.com/EigenVectorRobotics/orchestrator
repo_name: EigenVectorRobotics/orchestrator
edit_uri: ''
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

hooks:
  - docs/tools/hooks.py

extra:
  api_roots: [orchestrator, skill_registry, g1_skills, run_viewer/src]

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [orchestrator, skill_registry, g1_skills, run_viewer/src]
          options:
            show_root_heading: true
            show_root_full_path: true
            show_bases: true
            show_source: true
            members_order: source
            filters: ['!^_']
            separate_signature: true
            show_signature_annotations: true
            docstring_style: google
            heading_level: 2

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: README.md
  - Eigen Vector docs: https://eigenvectorrobotics.github.io/eigen_vector/
  - Architecture:
      - Overview: docs/architecture.md
      - System: docs/design/system.md
      - Classes and interfaces: docs/design/classes.md
      - Sequences: docs/design/sequences.md
      - Trees and the press slot: docs/design/trees.md
      - Agent skills: docs/agents.md
  - Running the robot:
      - Run: docs/run.md
      - Demo checklist: docs/demo.md
      - Machines: docs/machines.md
      - Troubleshooting: docs/troubleshooting.md
      - Recorded runs: docs/recorder.md
  - Packages:
      - g1_skills: g1_skills/README.md
      - mission_control: mission_control/README.md
      - Robot scripts: mission_control/robot/README.md
      - Run Viewer: run_viewer/README.md
  - Code map:
      - orchestrator: docs/code/orchestrator.md
      - orchestrator/agent: docs/code/orchestrator/agent.md
      - orchestrator/common: docs/code/orchestrator/common.md
      - orchestrator/execution: docs/code/orchestrator/execution.md
      - orchestrator/health: docs/code/orchestrator/health.md
      - orchestrator/planning: docs/code/orchestrator/planning.md
      - orchestrator/recording: docs/code/orchestrator/recording.md
      - orchestrator/skills: docs/code/orchestrator/skills.md
      - orchestrator/tree: docs/code/orchestrator/tree.md
      - orchestrator/vlm: docs/code/orchestrator/vlm.md
      - g1_skills: docs/code/g1_skills.md
      - skill_registry: docs/code/skill_registry.md
  - Rules for agents: CLAUDE.md
