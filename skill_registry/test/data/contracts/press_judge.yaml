name: press_judge
kind: action
device: nuc
description: >-
  The check after press_button, with an agent in the loop. The executor saves the frames of the press (baseline at
  the pre-grasp, press at the fingertip's closest point to the button, release after the retreat) and an agent looks
  at them and judges: pressed (success) or not_pressed (failure, recorded as the failed check of the press, so
  manipulation_recovery sees that press as checked_call).
interface:
  transport: agent
  skill: press_judge
inputs:
- name: phase
  type: enum
  choices: [judge]
  required: false
  default: judge
- name: target_description
  type: string
  required: true
  description: the button, as press_button was told
outputs:
- {name: decision, type: string}
- {name: reason, type: string}
needs_cloud: true
timeout_s: 600
maturity: untested
source: orchestrator/orchestrator/agent.py
notes: >-
  Put it right after press_button, in place of press_reached or button_lit. With agent_backend external (default), a
  Claude Code session answers with agent_cli: it copies the frames from the paths in the request and looks at them.
