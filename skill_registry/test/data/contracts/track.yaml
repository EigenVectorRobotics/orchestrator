name: track
kind: action
device: orin
description: Find an object by text and start 3D tracking of it
interface:
  transport: topic
  name: /keyboard_input
  ros_type: std_msgs/msg/String
  success_when:
    topic: /track_3d/is_tracking
    ros_type: std_msgs/msg/Bool
    field: data
    equals: true
inputs:
- name: query
  type: string
  description: one object, or several split by ';'
  field: data
check: is_tracking
resources:
- tracker
timeout_s: 10
maturity: wip
source: trt_edgetam/track_anything/track_anything/track_3d.py
notes: The VLM step runs on Thor, so this also fails when Thor drops out.
