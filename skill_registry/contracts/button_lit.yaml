name: button_lit
kind: condition
device: thor
description: >-
  The pressed button lit up. Judged by the VLM on the frames press_button kept: a baseline at the pre-grasp, one at the
  deepest push, one 0.5 s after the release; lit in either later frame means success. Each frame is cropped around
  the button's box from track_anything, grown 2.5 times. Without those frames, the latest camera frame is asked alone.
interface:
  transport: vlm
  frames: press_capture
  question: Is the {target_description} lit up?
  compare_question: >-
    This image is two close-up photos side by side, each centred on the same {target_description}. The left photo was
    taken just before the robot pressed the button, the right one during or after the press. Is the button lit in the
    right photo?
  choices:
  - lit
  - not_lit
  - unsure
  success_answer: lit
inputs:
- name: target_description
  type: string
  required: true
maturity: untested
notes: >-
  The VLM is the executor's vlm_base_url: by default the Thor, where cosmos_vlm_server answers with the Cosmos daemon.
  The camera runs at 6 fps (1280x720x6 on the Orin), so a chosen frame can be up to about 0.17 s after its moment.
