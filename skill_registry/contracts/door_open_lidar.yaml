name: door_open_lidar
kind: condition
device: nuc
description: The elevator door at the door pose is open, from the lidar (few scan points in the doorway); no camera, no cloud
interface:
  transport: points_in_box
  target:
    cloud_topic: /registered_scan     # the LIO scan in map
    frame: map
    robot_frame: base_link
    box: door
  limits:
    window_s: 1.0
    half_depth_m: 0.15
    half_width_m: 0.4
    min_up_m: 0.1
    max_up_m: 1.2
    max_points: 30
    min_scan_points: 1000
    max_distance_m: 4.0
inputs:
- name: door
  type: pose
  description: the doorway centre in map, yaw out of the cabin (a place saved with the robot in the doorway, facing out)
- {name: max_points, type: int, required: false, description: open at this many points in the box or fewer}
- {name: half_width_m, type: float, required: false}
record: true
maturity: untested
notes: >-
  The box is the door place plus or minus half_depth_m along its yaw and half_width_m across, from min_up_m to
  max_up_m above the robot's base_link (so one door place serves each floor of the shaft). A closed door fills it
  with points; an open one leaves only what stands in the doorway, such as a person. The limits are first guesses:
  record the counts with the door shut and open (the message gives them) and set max_points between. The Mid-360 on
  the head sees no lower than about 7 deg below level. door_open (the VLM) is the fallback when this cannot judge.
