name: ask_vlm
kind: action
device: thor
description: Ask the local VLM one closed question about the latest frame; the answer is one of the choices
interface:
  transport: vlm
  question: '{question}'
inputs:
- name: question
  type: string
- name: choices
  type: string
  description: answers split by ';', enforced by a JSON grammar
outputs:
- name: answer
  type: string
timeout_s: 5
maturity: untested
source: vlm/launch/llama_server.launch.py
notes: New adapter. Narrow perception questions only, never planning.
