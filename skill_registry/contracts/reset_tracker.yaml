name: reset_tracker
kind: action
device: orin
description: Drop all tracks
interface:
  transport: topic
  name: /track_3d/reset
  ros_type: std_msgs/msg/Empty
  success_when:
    topic: /track_3d/is_tracking
    ros_type: std_msgs/msg/Bool
    field: data
    equals: false
resources:
- tracker
timeout_s: 3
maturity: wip
source: trt_edgetam/track_anything/track_anything/track_3d.py
