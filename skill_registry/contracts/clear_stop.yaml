name: clear_stop
kind: action
device: nuc
description: Clear the safety stop (/stop 0) so navigation may move the base
interface:
  transport: topic
  name: /stop
  ros_type: std_msgs/msg/Int8
  fixed:
    data: 0
resources:
- base
timeout_s: 5
maturity: wip
source: navigation_stack/local_planner/src/path_follower.cpp, navigation_stack/cmd_vel_mux/src/cmd_vel_mux.cpp
notes: Any /stop level >= 1 stops the base in path_follower and cmd_vel_mux. Only clears it; a tree never sets it.
