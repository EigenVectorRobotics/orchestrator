name: manipulation_recovery
kind: action
device: nuc
description: >-
  After press_button fails or press_judge says not_pressed (phase diagnose), a model finds out why from the failure,
  the history, the press and the stance, and decides reposition, switch_arm, offset_retry, retry, ask_help or abort.
  Before the first press, when a look failed (button_in_view or check_reach; phase stance_check), it checks the
  stance the walk left and decides continue, reposition or abort. The executor's rules answer some calls first. Succeeds on reposition, switch_arm, offset_retry, retry
  and continue; fails on ask_help; abort fails the whole tree at once.
interface:
  transport: agent
  skill: manipulation_recovery
inputs:
- name: phase
  type: enum
  choices: [diagnose, stance_check]
  required: false
  default: diagnose
- name: target_description
  type: string
  required: false
  description: the button, as press_button was told
- name: base_goal
  type: pose
  required: false
  description: the place the robot was sent to press from; a reposition offset is relative to it
- name: max_rounds
  type: int
  required: false
  default: 5
  description: diagnoses allowed in one task; after that the skill fails at once
outputs:
- {name: decision, type: string}
- {name: reason, type: string}
- {name: goal, type: pose, description: 'base_goal moved by the reposition, or base_goal'}
- {name: approach, type: pose, description: 'reposition: where to walk first; 0.15 m behind goal when walk_in is yes, else goal'}
- {name: walk_in, type: string, description: 'yes when goal is under 0.10 m from the robot: walk to approach, then to goal'}
- {name: left_arm, type: bool, description: 'the arm for the next press'}
- {name: offset_x, type: float, description: 'offset_retry: the press offset along the button normal, m (set_press_offset x)'}
- {name: offset_y, type: float, description: 'offset_retry: sideways, m, positive left'}
- {name: offset_z, type: float, description: 'offset_retry: up, m'}
needs_cloud: true
timeout_s: 600
maturity: untested
source: orchestrator/orchestrator/agent.py
notes: >-
  The agent reads the failure, the history and the stance; it never publishes and never moves the robot. The agent
  bridge on the laptop answers through the Claude Agent SDK, with the camera image attached.
