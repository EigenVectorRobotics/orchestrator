name: set_autonomy
kind: action
device: nuc
description: Let navigation drive the base (true) or not (false)
interface:
  transport: topic
  name: /autonomy_mode
  ros_type: std_msgs/msg/Bool
inputs:
- name: enabled
  type: bool
  field: data
resources:
- base
timeout_s: 5
maturity: wip
source: navigation_stack/local_planner/src/path_follower.cpp
notes: >-
  path_follower and local_planner start with autonomy_mode false (path_follower_params.yaml), so navigate_to routes
  but the robot does not move until this is true. The field test turned it on before a walk and off after arrival.
