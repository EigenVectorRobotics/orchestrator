name: set_hand
kind: action
device: orin
description: Set a hand pose
interface:
  transport: service
  name: /unitree_interface/set_hand_pose
  ros_type: unitree_interface_msgs/srv/SetHandPose
inputs:
- name: hand
  type: enum
  field: target_hand
  values:
    left: 0
    right: 1
- name: pose
  type: enum
  field: target_pose
  values:
    ball: 0
    point: 1
resources:
- arms
timeout_s: 3
maturity: wip
source: unitree_interface/unitree_interface_msgs/srv/SetHandPose.srv
