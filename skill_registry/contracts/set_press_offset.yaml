name: set_press_offset
kind: action
device: nuc
description: >-
  Set the press offset of the arm planner: move_to_pose shifts every press target by (x, y, z) in the target's own
  frame, x along the button normal (positive deeper into the panel), y sideways (positive left), z up. It reads them
  at every plan, so the next press uses them. They live only in the running node and go back to 0 on a relaunch.
interface:
  transport: service
  name: /move_to_pose_server/set_parameters
  ros_type: rcl_interfaces/srv/SetParameters
  fixed:
    parameters:
    - {name: arm_safety_distance_x, value: {type: 3}}
    - {name: arm_safety_distance_y, value: {type: 3}}
    - {name: arm_safety_distance_z, value: {type: 3}}
inputs:
- {name: x, type: float, field: parameters.0.value.double_value, description: 'metres along the button normal, positive deeper'}
- {name: y, type: float, field: parameters.1.value.double_value, description: 'metres sideways, positive left'}
- {name: z, type: float, field: parameters.2.value.double_value, description: 'metres up'}
resources:
- arms
timeout_s: 5
maturity: untested
source: manipulation_stack g1_pilot/src/move_to_pose/planning.cpp (to_pelvis_frame_); docs/RUNBOOK.md "How the offset works"
notes: >-
  Set it per panel and per arm before each press (the offsets that work differ: experience E-012), and after a
  manipulation_recovery offset_retry. On 2026-11-04 the inside panel, right arm, floor 1 hit the rim with 0 and
  lit with (+0.005, +0.0075, +0.0034).
