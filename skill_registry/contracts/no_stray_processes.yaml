name: no_stray_processes
kind: action
device: nuc
description: >-
  Every stack node runs from its host's launch (nuc.launch.py, orin.launch.py) and workspace, and no orphaned helper
  (ros2 topic echo, ros2 bag record) is left over. Read only; preflight only warns.
interface:
  transport: command
  command: python3 -m orchestrator.stale_nodes strays
timeout_s: 45
maturity: untested
source: orchestrator/orchestrator/stale_nodes.py (judge, stray_findings, orphan_findings)
notes: >-
  A node restarted by hand (tmux, nohup) still works, but a stack restart would start a second copy. An orphan is a
  helper whose parent is init, older than its grace (10 min, 3 h for a bag record); it holds a DDS participant
  index, and the indexes can run out. The message names each one with its host and pid.
