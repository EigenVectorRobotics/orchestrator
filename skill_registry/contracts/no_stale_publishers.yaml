name: no_stale_publishers
kind: condition
device: nuc
description: >-
  No leftover process publishes on the topics that drive the arm and its target. A second publisher, such as a
  replay or a test script left running, makes the hand jump during a press.
interface:
  transport: graph
  topics:
    /position_control: 1
    /feedback: 1
    /track_3d/selected_normal_pose_filtered/arm_upright: 1
    /reset_filter: 1
maturity: untested
notes: Check it before press_button; on failure, the trace names every publisher of the topic.
