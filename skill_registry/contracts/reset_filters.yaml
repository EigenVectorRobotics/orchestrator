name: reset_filters
kind: action
device: nuc
description: Reset the arm target filter so the press starts from fresh track poses, not ones from before a walk or an earlier press
interface:
  transport: topic
  name: /reset_filter
  ros_type: std_msgs/msg/Bool
  fixed:
    data: true
timeout_s: 5
maturity: untested
source: manipulation_stack/humanoid_arm_skills/humanoid_arm_skills/pose_filtering.py
notes: >-
  Run it with the robot standing at the panel, right before press_button, after the body EKF reset
  (reset_ekf).
