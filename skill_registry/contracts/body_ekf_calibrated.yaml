name: body_ekf_calibrated
kind: condition
device: nuc
description: The body EKF publishes the torso pose (a message within the last 0.5 s), so it is calibrated. False after reset_body_ekf until its still period is done.
interface:
  transport: watch
  success_when:
    topic: /body_ekf/torso_pose
    ros_type: geometry_msgs/msg/PoseStamped
    field: header.frame_id
    equals: foot_world
    max_age_s: 0.5
maturity: untested
source: manipulation_stack g1_pilot body_ekf (torso_pose_topic, fixed_frame foot_world)
notes: The pose is published at the IMU rate while calibrated; after ~/reset none comes until the still period ends.
