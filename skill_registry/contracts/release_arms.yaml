name: release_arms
kind: action
device: orin
description: Give arm control back to the locomotion controller
interface:
  transport: service
  name: /unitree_interface/release_arms
  ros_type: std_srvs/srv/Trigger
resources:
- arms
timeout_s: 12                   # the call took 5.7 s from the CLI on 2026-11-04; 5 s timed out
maturity: wip
source: unitree_interface/unitree_interface/src/unitree_interface.cpp
notes: Refused in low-level mode, so it fails while SONIC drives the robot (sim and real).
