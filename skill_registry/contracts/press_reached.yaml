name: press_reached
kind: condition
device: nuc
description: >-
  The last press got the fingertip onto the button: at its deepest point it was close enough to the goal along the
  button normal and sideways. Use it where a button does not light.
interface:
  transport: press_tip
  limits:
    min_depth_m: -0.012
    max_lateral_m: 0.008
maturity: untested
notes: >-
  Judged from the end-effector pose (TF right_ee or left_ee, forward kinematics from the encoders) against the
  goal the arm was sent, both in foot_world. The limits are first guesses: a button is about 20 mm across.
