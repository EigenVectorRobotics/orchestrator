name: clear_terrain_map
kind: action
device: nuc
description: >-
  Clear the latched points of the local terrain map. Use it when navigate_to fails with the robot not moving and no
  free path (an empty /free_paths, one-pose stop paths on /path): points that come back after the clear are real.
interface:
  transport: topic
  name: /clear_terrain_map
  ros_type: std_msgs/msg/Empty
timeout_s: 3
maturity: untested
source: navigation_stack terrain_analysis; docs/RUNBOOK.md ("A walk that routes but never moves")
notes: >-
  On 2026-11-04 the walk from the call panel into the cabin found no free path (latched points 0.2 m ahead); one clear
  freed 3154 paths at once.
