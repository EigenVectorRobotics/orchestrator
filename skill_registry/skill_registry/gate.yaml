# Inside a code skill, which calls still ask the operator (docs/task-mode.md). A code skill is approved once, and
# then every call it makes that can act on the robot asks again. A call that only reads never asks.
#
# Quiet names the few acting skills that are not worth a question. Everything else asks, so a skill the agent wrote
# for an interface nobody listed here still stops. This is the operator's file: the agent never writes it.

quiet:
  names:                # fnmatch patterns, for every ROS name a contract uses; a leading / is ignored
    - '/speak'                          # the robot talks
    - '*clear_terrain_map'              # it drops stale map points
    - '/reset_filter'
    - '*/track_3d/reset'

  types: []             # fnmatch patterns for ros_type, when a name is not enough
