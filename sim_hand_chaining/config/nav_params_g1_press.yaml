# Navigation stack parameters for the press poses (locomotion nav), set by the executor at each command through the
# nodes' parameter services (task_executor.py nav_params); the files of navigation_stack are not changed.
# From tool/hand_chaining/nav_approach_test.py (2026-10-28, set precise_turn; analysis/fvd_sim_failure_modes.md section 3).
# As deployed (unitree_g1.yaml) the robot stops 0.13 to 0.30 m before a press pose and cannot reach the button.

local_planner:
  goal_reached_threshold: 0.06   # m, was 0.3: the press region is +-5 cm
  goal_yaw_threshold: 0.1        # rad, was 0.15
  goal_clear_range: 0.2          # m, was 0.6: the press poses are 0.52 m from the panel wall; with 0.6 the wall blocks the
                                 # head-on approach and, at the goal, the turn onto its heading (run 33)
  goal_behind_range: 0.0         # m, was 0.8: a goal just behind after a small overshoot is backed up to, not turned to

path_follower:
  stop_distance_threshold: 0.03       # m, was 0.4: it stopped walking 0.4 m before the end of the path
  slow_down_distance_threshold: 0.25  # m, was 0.875: the sim gait stands under 0.1 m/s
  two_way_drive: true                 # was false; the local planner is two-way (default)
  omni_direction_goal_threshold: 0.25 # m, was -1 (off): crab in the last 0.25 m. On the straight last leg to a press pose a
                                      # robot 5 cm beside the line stopped 0.15 m short and turned in place to the goal;
                                      # the turn moved the base and it turned on for 60 s (2 of 4 legs; 0 of 19 with this)
  min_turn_yaw_rate: 18.0             # deg/s, was 0: the sim gait does not turn in place under ~14 deg/s
  min_turn_deadband: 0.08             # rad
